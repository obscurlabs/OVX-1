[project]
name = "voicerag"
version = "0.1.0"
description = "Voice-enabled RAG over MSMARCO-XI (Hindi/English) - HH Goa 2026 Task 2"
requires-python = ">=3.12,<3.13"

# Core = what the DEPLOYED server needs. Deliberately light: no torch.
# The Render instance runs onnxruntime on CPU, so the image stays small and cheap.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "httpx>=0.27",
    "numpy>=1.26,<3",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "rank-bm25>=0.2.2",
    # usearch over hnswlib: same HNSW algorithm, but ships Windows wheels (hnswlib
    # is source-only and needs MSVC). Also gives native int8 quantization and
    # memory-mapped index loading, which is what lets Render serve this on a small tier.
    "usearch>=2.16",
    "groq>=0.11",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Indexing = LOCAL ONLY. Runs once on the RTX 4050 to build the index,
# then never ships. This is where the 2.8GB of torch lives.
index = [
    "torch>=2.5",
    "sentence-transformers>=3.2",
    "transformers>=4.45",
    "datasets>=3.0",
    "pyarrow>=17",
    "optimum[onnxruntime]>=1.23",
    "accelerate>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicerag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
